<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdosh International</title>
<meta name="description" content="Abdosh International. Our new website is coming soon. Contact us at info@abdosh.com.">
<meta name="robots" content="index,follow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --green: #5aa31a; --ink: #1f2a1a; --muted: #6b7466; --bg: #f7f8f5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .card { max-width: 560px; width: 100%; text-align: center; }
  .mark { display: inline-flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .mark .name { font-size: clamp(30px, 6vw, 44px); font-weight: 800; letter-spacing: .5px; color: var(--green); }
  .mark .tail { font-size: clamp(22px, 4.5vw, 32px); font-weight: 300; color: var(--muted); }
  .rule { height: 3px; width: 72px; background: var(--green); margin: 18px auto 28px; border-radius: 2px; }
  h1 { font-size: clamp(20px, 3.5vw, 26px); font-weight: 600; margin: 0 0 12px; }
  p { font-size: 17px; line-height: 1.55; color: var(--muted); margin: 0 0 22px; }
  .contact { display: inline-block; background: #fff; border: 1px solid #e3e7df; border-radius: 12px; padding: 16px 22px; }
  .contact span { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 6px; }
  .contact a { font-size: 19px; font-weight: 600; color: var(--green); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  footer { text-align: center; padding: 20px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark"><span class="name">ABDOSH</span><span class="tail">International</span></div>
    <div class="rule"></div>
    <h1>Our new website is coming soon</h1>
    <p>We are working on a new abdosh.com. In the meantime, please get in touch by email.</p>
    <div class="contact">
      <span>Enquiries</span>
      <a href="mailto:info@abdosh.com">info@abdosh.com</a>
    </div>
  </div>
</main>
<footer>&copy; <span id="y"></span> Abdosh International</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
